version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodhub-postgres
    restart: always
    environment:
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: foodhub_secret
      POSTGRES_DB: foodhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodhub -d foodhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodhub-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: foodhub-mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: foodhub-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://foodhub:foodhub_secret@postgres:5432/foodhub?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "prod_jwt_access_secret_super_secure_key_12345"
      JWT_REFRESH_SECRET: "prod_jwt_refresh_secret_super_secure_key_67890"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      PAYMENT_GATEWAY_PROVIDER: "mock"
      SMS_PROVIDER: "dev"
      EMAIL_PROVIDER: "dev"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: foodhub-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
